name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and Build-Tools
      run: |
        yes | sdkmanager --licenses
        sdkmanager "build-tools;33.0.2" "ndk;25.2.9519653" "platforms;android-33"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip autoconf libtool pkg-config cmake ninja-build ccache libncurses5-dev libncursesw5-dev libtinfo5

    - name: Install Python tools
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install "cython<3.0.0" buildozer

    - name: Configure buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # Автопринятие лицензий и базовые настройки
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3==3.11.5,kivy/' buildozer.spec
        
        # Указываем Buildozer использовать уже установленный SDK/NDK
        sed -i 's/# android.sdk_path = .*/android.sdk_path = \/usr\/local\/lib\/android\/sdk/' buildozer.spec
        sed -i 's/# android.ndk_path = .*/android.ndk_path = \/usr\/local\/lib\/android\/sdk\/ndk\/25.2.9519653/' buildozer.spec
        sed -i 's/# android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = .*/android.minapi = 24/' buildozer.spec
        sed -i 's/# android.build_tools_version = .*/android.build_tools_version = 33.0.2/' buildozer.spec

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
