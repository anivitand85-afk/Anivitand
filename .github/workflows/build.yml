name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libssl-dev libffi-dev python3-dev \
          zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          cmake ninja-build ccache libncurses5-dev libncursesw5-dev \
          libtinfo5 wget

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install "cython<3.0.0" buildozer

    - name: Configure buildozer.spec
      run: |
        rm -f buildozer.spec
        buildozer init

        # Разрешаем сборку и авто-принятие лицензий
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        
        # Сборка только под arm64
        sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        
        # Зависимости
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        
        # Версии API и NDK
        sed -i 's/# android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = .*/android.minapi = 24/' buildozer.spec
        sed -i 's/# android.ndk = .*/android.ndk = 25b/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        # Используем yes для автоматического согласия со всеми лицензиями SDK/NDK
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
