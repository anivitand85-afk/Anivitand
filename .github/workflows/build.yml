name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configure buildozer.spec
      run: |
        rm -f buildozer.spec
        buildozer init

        # Разрешаем сборку и автопринятие лицензий
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        
        # Сборка под arm64
        sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        
        # Зависимости Python
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        
        # Совместимые версии API и NDK
        sed -i 's/# android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = .*/android.minapi = 24/' buildozer.spec
        sed -i 's/# android.ndk = .*/android.ndk = 25b/' buildozer.spec

    - name: Build with Buildozer Action
      uses: ArtemSnd/buildozer-action@v1.2
      with:
        command: buildozer -v android debug
        buildozer_version: master

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
