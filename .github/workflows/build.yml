name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libssl-dev libffi-dev python3-dev \
          zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          cmake ninja-build ccache libncurses5-dev libncursesw5-dev \
          libtinfo5 wget

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install "cython<3.0.0" buildozer

    - name: Configure buildozer.spec
      run: |
        rm -f buildozer.spec
        buildozer init

        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        sed -i 's/# android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = .*/android.minapi = 24/' buildozer.spec
        sed -i 's/# android.ndk = .*/android.ndk = 25b/' buildozer.spec

    - name: Pre-accept SDK Licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        printf "24833b2982365686222214314519807237389140\n89330d1709806eb19623011172f3679a22a4476e\n79322ba8426f5e9f5f6555b773c2378756410345" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        printf "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license"

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
