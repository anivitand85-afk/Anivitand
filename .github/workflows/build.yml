name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config cmake ninja-build ccache libncurses5-dev libncursesw5-dev libtinfo5 wget

    - name: Install Python tools
      run: |
        python -m pip install --upgrade pip setuptools
        python -m pip install "cython<3.0.0" buildozer

    - name: Download Compatible NDK r25b
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
        unzip -q ndk.zip -d $HOME/.buildozer/android/platform/
        rm ndk.zip

    - name: Pre-install Android Command-Line Tools
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"
        mkdir -p "$SDK_DIR/licenses"
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
        unzip -q commandlinetools.zip -d "$SDK_DIR/cmdline-tools"
        mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
        rm commandlinetools.zip
        
        ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"

        echo -e "\n24833b2982365686222214314519807237389140\n89330d1709806eb19623011172f3679a22a4476e\n79322ba8426f5e9f5f6555b773c2378756410345" > "$SDK_DIR/licenses/android-sdk-license"
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
        echo -e "\nd976narrow84570b5a2e9a706d3108447572d24c352630d7ede" > "$SDK_DIR/licenses/intel-android-sys-image-license"

    - name: Prepare buildozer.spec
      run: |
        rm -f buildozer.spec
        buildozer init

        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        
        # Фиксируем одинаковую версию Python3 и Hostpython3
        sed -i 's/requirements = python3,kivy/requirements = python3==3.11.5,hostpython3==3.11.5,kivy/' buildozer.spec
        
        sed -i 's/# android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = .*/android.minapi = 24/' buildozer.spec
        sed -i 's/# android.ndk_path = .*/android.ndk_path = ~\/_buildozer\/android\/platform\/android-ndk-r25b/' buildozer.spec
        sed -i 's/# android.build_tools_version = .*/android.build_tools_version = 33.0.2/' buildozer.spec

    - name: Build APK
      run: |
        APP_ANDROID_NDK_HOME="$HOME/.buildozer/android/platform/android-ndk-r25b" buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk
